server:
  # Render (y otros PaaS) inyectan PORT. En local, 8080.
  port: ${PORT:8080}
  # Contenedor: escuchar en todas las interfaces para que el health check vea el puerto.
  address: 0.0.0.0

spring:
  application:
    name: factorIT

  # # # # # Base de datos (Render + Supabase) # # # # #
  datasource:
    url: "jdbc:postgresql://localhost:5432/carrito_db"
    username: postgres
    password: ${DB_PASSWORD:postgres}

  # # # # # Configuración ORM # # # # #
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configuración de Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
