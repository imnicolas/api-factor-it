server:
  # Railway inyecta su propio puerto en la variable PORT. Si no existe (local), usa 8080.
  port: ${PORT:8080}

spring:
  application:
    name: factorIT

  # # # # # Base de datos # # # # #
  datasource:
    url: ${DB_URL}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # # # # # Configuración ORM # # # # #
  # Atención: 'jpa' va al mismo nivel que 'datasource', no anidado.
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configuración de Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method