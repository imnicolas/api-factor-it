server:
  # Railway inyecta su propio puerto en la variable PORT. Si no existe (local), usa 8080.
  port: ${PORT:8080}

spring:
  application:
    name: factorIT

  # # # # # Base de datos # # # # #
  datasource:
    # Railway define DATABASE_URL como postgresql://usuario:clave@host:puerto/db
    # El prefijo jdbc: produce una URL JDBC válida (jdbc:postgresql://...).
    # Valor por defecto: desarrollo local cuando no hay DATABASE_URL.
    url: jdbc:postgresql://db.oxcxzdwrumwdypladbjw.supabase.co:5432/postgres?user=postgres&password=7dypy&7ce!R75Fx

  # # # # # Configuración ORM # # # # #
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configuración de Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method